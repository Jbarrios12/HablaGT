name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint (0 errores; las advertencias no bloquean)
        run: npx eslint .
      - name: Compilar
        run: npm run build
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
